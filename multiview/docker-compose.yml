services:
  multiview:
    build:
      context: ..
      dockerfile: multiview/Dockerfile
    container_name: plexflix-multiview
    restart: unless-stopped
    # Host network so :8095 is on the host. Vendored advanced-proxy binds
    # 127.0.0.1:18787 (not :8787) so it doesn't collide with the LAN sidecar.
    network_mode: host
    environment:
      VARIANT_HEIGHT: "480"
      MAX_SESSIONS: "2"
      IDLE_TIMEOUT: "90"
      # Optional shared secret; set the same value as multiviewToken in PlexConfig.brs
      MULTIVIEW_TOKEN: ""
      PROXY_HEADLESS: "true"
      MULTIVIEW_PROXY_PORT: "18787"
      PROXY_HOST: "127.0.0.1:18787"
    tmpfs:
      - /data:size=1g

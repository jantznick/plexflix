services:
  multiview:
    build:
      context: ..
      dockerfile: multiview/Dockerfile
    container_name: plexflix-multiview
    restart: unless-stopped
    network_mode: host
    environment:
      # Software x264 mosaic encode (ultrafast / zerolatency in mosaic.py)
      VIDEO_BITRATE: 3M
      FPS: "20"
      VARIANT_HEIGHT: "480"
      MAX_SESSIONS: "2"
      IDLE_TIMEOUT: "90"
      LIVE_SLOTS: "2"
      MULTIVIEW_TOKEN: ""
      PROXY_HEADLESS: "true"
      MULTIVIEW_PROXY_PORT: "18787"
      PROXY_HOST: "127.0.0.1:18787"
    tmpfs:
      - /data:size=1g

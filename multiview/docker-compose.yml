services:
  multiview:
    build:
      context: ..
      dockerfile: multiview/Dockerfile
    container_name: plexflix-multiview
    restart: unless-stopped
    # Host network so :8095 is on the host directly (no ports: mapping).
    # Multiview fetches sports CDNs itself; it does not call roku-feed's proxy.
    network_mode: host
    environment:
      # x264 works anywhere but is CPU-heavy at 1080p. With an Intel or AMD GPU
      # use va (or qsv on Intel) and the devices block below; with NVIDIA,
      # nvenc and the deploy block below. Unusable hardware falls back to x264.
      ENCODER: x264
      # Soft defaults for software encode; with va/qsv/nvenc you can raise these
      VIDEO_BITRATE: 3M
      FPS: "20"
      # Which rendition each feed is decoded from (closest at or above this)
      VARIANT_HEIGHT: "480"
      MAX_SESSIONS: "2"
      IDLE_TIMEOUT: "90"
      # Optional shared secret; set the same value as multiviewToken in PlexConfig.brs
      MULTIVIEW_TOKEN: ""
    # Segments churn constantly, so keep them in RAM rather than on disk
    tmpfs:
      - /data:size=1g
    # Intel / AMD hardware encoding:
    # devices:
    #   - /dev/dri:/dev/dri
    # NVIDIA (needs nvidia-container-toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video]
